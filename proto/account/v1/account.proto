syntax = "proto3";

package account.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/itlacomvn/la-api-contracts/gen/go/account/v1;accountv1";

// AccountService is the primary internal API. Other services (monolith,
// gateway, future microservices) resolve users through this service — never
// through the Keycloak Admin API directly (see spec §2).
service AccountService {
  // Lookup an account by internal id, keycloak_id, email or username.
  rpc GetAccount(GetAccountRequest) returns (Account);

  // Batch lookup — resolve up to 200 users in a single call.
  rpc BatchGetAccounts(BatchGetAccountsRequest) returns (BatchGetAccountsResponse);

  // JIT provisioning: called after a user logs in for the first time.
  // Idempotent — calling again with the same keycloak_id returns the existing account.
  rpc EnsureAccount(EnsureAccountRequest) returns (Account);

  rpc UpdateProfile(UpdateProfileRequest) returns (Account);

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Change business status; the service syncs enabled/disabled to Keycloak.
  rpc SetAccountStatus(SetAccountStatusRequest) returns (Account);

  // Self-service password change. The target user is the bearer token's SUBJECT
  // — the request carries no account id on purpose, so there is no shape of this
  // call that changes somebody else's password. Every session of that user is
  // revoked on success, which also ends the caller's own session.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Privileged reset of ANOTHER user's password (helpdesk). Requires the realm
  // role "account-admin"; set temporary to force a change at next login.
  rpc AdminResetPassword(AdminResetPasswordRequest) returns (AdminResetPasswordResponse);

  // Identity providers linked to one account (Keycloak identity brokering).
  // An account with no links returns an empty list, not NOT_FOUND.
  rpc GetLinkedIdentities(GetLinkedIdentitiesRequest) returns (GetLinkedIdentitiesResponse);

  // Batch form of GetLinkedIdentities, so a caller hydrating a page of accounts
  // makes one call instead of one per row.
  rpc BatchGetLinkedIdentities(BatchGetLinkedIdentitiesRequest) returns (BatchGetLinkedIdentitiesResponse);

  // Reverse lookup: the account linked to a provider's user id. NOT_FOUND when
  // no account is linked to it.
  rpc GetAccountByIdentity(GetAccountByIdentityRequest) returns (GetAccountByIdentityResponse);
}

// OdooMappingService is deliberately separate so it can be removed cleanly once
// the Odoo migration is complete (spec §5, §10.4).
service OdooMappingService {
  rpc GetAccountByOdooUser(GetAccountByOdooUserRequest) returns (Account);
  rpc GetOdooMapping(GetOdooMappingRequest) returns (OdooMapping);
  rpc UpsertOdooMapping(UpsertOdooMappingRequest) returns (OdooMapping);

  // Batch resolve, so a caller hydrating a page of accounts with their Odoo ids
  // (or the reverse) makes one call instead of one per row.
  rpc BatchGetOdooMappings(BatchGetOdooMappingsRequest) returns (BatchGetOdooMappingsResponse);
}

message Account {
  string id = 1; // internal UUID — other services store FK by this value
  string keycloak_id = 2;
  string email = 3;
  string username = 4;
  AccountStatus status = 5;
  Profile profile = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_SUSPENDED = 2;
  ACCOUNT_STATUS_DEACTIVATED = 3;
}

message Profile {
  string full_name = 1;
  string display_name = 2;
  string phone = 3;
  string avatar_url = 4;
  string locale = 5;
  string timezone = 6;
  map<string, string> attributes = 7;
}

message GetAccountRequest {
  oneof lookup {
    string id = 1;
    string keycloak_id = 2;
    string email = 3;
    string username = 4;
  }
}

message BatchGetAccountsRequest {
  repeated string ids = 1; // max 200
}
message BatchGetAccountsResponse {
  repeated Account accounts = 1;
}

message EnsureAccountRequest {
  string keycloak_id = 1;
  string email = 2;
  string username = 3;
  string full_name = 4;
  OdooHint odoo_hint = 5;       // optional, only when logging in via Odoo OAuth2
}
message OdooHint {
  string odoo_db = 1;
  int32 odoo_user_id = 2;
  string odoo_login = 3;
}

message UpdateProfileRequest {
  string account_id = 1;
  Profile profile = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message ListAccountsRequest {
  int32 page_size = 1;      // default 50, max 500
  string page_token = 2;
  AccountStatus status = 3; // optional filter
  string query = 4;         // search by email/username/full_name
  // Restrict the listing to these account ids; empty means "no restriction".
  // Max 1000 — more returns INVALID_ARGUMENT, as does any unparseable uuid.
  // Ids that match no account are silently skipped, so the page may be shorter
  // than page_size without meaning "last page" — trust next_page_token instead.
  //
  // Composes with status and query via AND: passing ids together with query
  // searches WITHIN the id set. Ordering and paging are unchanged, so callers
  // that resolve an id set locally (e.g. org members) still get one consistent
  // page sequence over exactly that set.
  repeated string ids = 5;

  // Offset pagination, for callers that must render numbered pages and a total
  // (the keyset cursor above can express neither). Its PRESENCE selects the
  // mode — page 1 is offset 0, which is why this is `optional` rather than a
  // plain int32 that could not tell "first page" from "not set".
  //
  // Sending both offset and page_token is INVALID_ARGUMENT: they are two
  // different cursors over the same ordering and honouring one would silently
  // ignore the other. In offset mode next_page_token is empty and total_size is
  // always populated, which costs one extra COUNT over the same filters.
  optional int32 offset = 6;
}
message ListAccountsResponse {
  repeated Account accounts = 1;
  // Keyset mode only; empty in offset mode and on the last page.
  string next_page_token = 2;
  // Rows matching the filters, ignoring pagination. Offset mode only — it stays
  // 0 in keyset mode, where no honest total can be produced.
  int32 total_size = 3;
}

message SetAccountStatusRequest {
  string account_id = 1;
  AccountStatus status = 2;
  string reason = 3;
}

message GetAccountByOdooUserRequest {
  string odoo_db = 1;
  int32 odoo_user_id = 2;
}
message GetOdooMappingRequest {
  string account_id = 1;
  string odoo_db = 2;
}
message UpsertOdooMappingRequest {
  string account_id = 1;
  string odoo_db = 2;
  int32 odoo_user_id = 3;
  string odoo_login = 4;
}
// Exactly one of account_ids / odoo_user_ids must be set — both, or neither, is
// INVALID_ARGUMENT rather than a guess at what was meant. Max 500 ids per call.
// Ids that match no mapping are skipped silently, so the response may be shorter
// than the request; it is a lookup, not a page, so there is no cursor.
message BatchGetOdooMappingsRequest {
  string odoo_db = 1;
  repeated string account_ids = 2;
  repeated int32 odoo_user_ids = 3;
}
message BatchGetOdooMappingsResponse {
  repeated OdooMapping mappings = 1;
}

message OdooMapping {
  string account_id = 1;
  string odoo_db = 2;
  int32 odoo_user_id = 3;
  string odoo_login = 4;
  google.protobuf.Timestamp synced_at = 5;
}

// --- password ---
//
// Neither request carries the current password: this service does not verify it.
// A valid bearer token is the whole authorisation, so an access token is as
// powerful as the password itself until it expires — which is why a successful
// change revokes every session.

message ChangePasswordRequest {
  string new_password = 1; // required; strength is enforced by the realm's password policy
}
message ChangePasswordResponse {
  // false means the password WAS changed but revoking the sessions failed —
  // tell the user to sign out their other devices manually.
  bool sessions_revoked = 1;
}

message AdminResetPasswordRequest {
  string account_id = 1;   // required
  string new_password = 2; // required
  bool temporary = 3;      // true = Keycloak forces the user to change it at next login
  string reason = 4;       // optional, recorded in the audit log
}
message AdminResetPasswordResponse {
  bool sessions_revoked = 1;
}

// --- linked identities ---

enum IdentityProvider {
  IDENTITY_PROVIDER_UNSPECIFIED = 0;
  IDENTITY_PROVIDER_ODOO = 1;      // Odoo OAuth; provider_user_id = res.users.id (decimal string)
  IDENTITY_PROVIDER_MICROSOFT = 2; // Microsoft Entra ID; provider_user_id = the object id (oid)
}

message LinkedIdentity {
  string account_id = 1;
  IdentityProvider provider = 2;
  string provider_user_id = 3; // see IdentityProvider for the format per provider
  string provider_username = 4;
  google.protobuf.Timestamp linked_at = 5;
}

message GetLinkedIdentitiesRequest {
  string account_id = 1; // required
}
message GetLinkedIdentitiesResponse {
  repeated LinkedIdentity identities = 1;
}

// Max 200 account_ids, like BatchGetAccounts. Accounts with no link (or no link
// to the requested provider) are simply absent from the response; it is a
// lookup, not a page, so there is no cursor.
message BatchGetLinkedIdentitiesRequest {
  repeated string account_ids = 1;
  IdentityProvider provider = 2; // optional filter; UNSPECIFIED = all providers
}
message BatchGetLinkedIdentitiesResponse {
  repeated LinkedIdentity identities = 1;
}

message GetAccountByIdentityRequest {
  IdentityProvider provider = 1;  // required, UNSPECIFIED is INVALID_ARGUMENT
  string provider_user_id = 2;    // required
}
message GetAccountByIdentityResponse {
  Account account = 1;
  LinkedIdentity identity = 2;
}
